package:
  name: mark_pipeline
  version: "1.2.6"

source:
  path: ..

build:
  number: 0
  noarch: generic

requirements:
  host:
    - python=3.10
  run:
    - python=3.10
    - tk
    - biopython
    - pandas
    - numpy<2.0
    - matplotlib
    - pysam
    - pillow
    # Minimum versions: the tool set this release was validated with.
    - fastp >=1.3.7
    - fastplong >=0.7.1
    - fastqc >=0.12.1
    - cutadapt >=5.2
    - bwa-mem2 >=2.3
    - minimap2 >=2.31
    - samtools >=1.24
    - bcftools >=1.24

test:
  commands:
    - MARK.sh --help || true

about:
  home: https://github.com/DP-Genome/MARK
  license: MIT
  summary: "MARK: Mitochondrial Amplicon Resolving Kit. For variant calling of
    Mitochondria's Hypervariable region"
