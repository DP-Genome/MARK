package:
  name: mark_pipeline
  version: "1.6.1"

source:
  path: ..

build:
  number: 0
  noarch: generic

requirements:
  host:
    - python=3.10
  run:
    - python=3.10
    - tk
    - biopython
    - pandas
    - numpy<2.0
    - matplotlib
    - pysam
    - pillow
    # Minimum versions: the tool set this release was validated with.
    - fastp >=1.3.7
    - fastplong >=0.7.1
    - fastqc >=0.12.1
    - cutadapt >=5.2
    - bwa-mem2 >=2.3
    - minimap2 >=2.31
    - samtools >=1.24
    - bcftools >=1.24
    # freebayes (the variant caller since v1.4) is NOT listed: its bioconda builds need htslib 1.21 and an
    # older libdeflate, which conflict with samtools/bcftools 1.24 and fastp 1.3.7 on linux-64 and osx-arm64.
    # Install it in its own environment (conda create -n mark_fb -c conda-forge -c bioconda freebayes=1.3.10);
    # MARK.sh, MARK-I.sh and the launcher find an environment named mark_fb by themselves.

test:
  commands:
    - MARK.sh --help || true

about:
  home: https://github.com/DP-Genome/MARK
  license: MIT
  summary: "MARK: Mitochondrial Amplicon Resolving Kit. For variant calling of
    Mitochondria's Hypervariable region"
  description: |
    MARK calls variants with freebayes by default; since v1.5, VARIANT_CALLER=bcftools or both (freebayes calls,
    compared with bcftools) are also available. Install freebayes in its own environment after this package:
    conda create -n mark_fb -c conda-forge -c bioconda freebayes=1.3.10
    MARK finds an environment named mark_fb by itself, or set FREEBAYES=/path/to/freebayes.
